server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  gzip on;
  gzip_types text/css application/javascript application/json text/csv image/svg+xml;

  location /logs/ {
    autoindex on;
    add_header Cache-Control "no-cache";
  }

  location ~* \.(js|css|svg)$ {
    add_header Cache-Control "no-cache";
  }
}
