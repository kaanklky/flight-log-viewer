<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EdgeTX Flight Log Viewer</title>
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
<link rel="stylesheet" href="vendor/maplibre-gl.css">
<link rel="stylesheet" href="css/style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
<script src="vendor/maplibre-gl.js"></script>
<script type="module" src="js/main.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand"><img src="assets/logo.svg" alt="" width="34" height="32">EdgeTX Flight Log Viewer</div>
  <div class="chips" id="chips"></div>
  <div class="spacer"></div>
  <div class="seg" id="viewToggle" role="group" aria-label="Map view">
    <button type="button" data-view="flat">2D</button>
    <button type="button" data-view="terrain" class="on">3D Terrain</button>
  </div>
  <button type="button" class="icon-btn" id="themeBtn" aria-label="Toggle light or dark theme" title="Toggle theme">
    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
  <label class="trail-color lib" id="libWrap" hidden>Saved logs
    <select id="library" aria-label="Open a saved log"></select>
  </label>
  <button type="button" class="primary" id="openBtn">Open from computer</button>
  <input type="file" id="fileInput" accept=".csv,text/csv,text/plain" multiple hidden>
</header>

<div class="workspace">
  <div class="stage" id="stage">
    <div id="map"></div>

    <div class="badges" id="badges"></div>

    <div class="overlay-tr">
      <div class="cam-modes" id="camModes" role="group" aria-label="Camera mode">
        <button type="button" data-mode="chase">Chase</button>
        <button type="button" data-mode="tail">Tail</button>
        <button type="button" data-mode="orbit">Orbit</button>
        <button type="button" data-mode="cinematic">Cinematic</button>
        <button type="button" data-mode="topdown" class="on">Topdown</button>
        <button type="button" data-mode="manual">Manual</button>
      </div>
      <label class="trail-color">Trail
        <select id="trailColor">
          <option value="speed">Speed</option>
          <option value="altitude">Altitude</option>
          <option value="battery">Battery</option>
        </select>
      </label>
      <label class="trail-color">Altitude
        <select id="altMode" title="How the logged altitude is placed on the map">
          <option value="msl">As logged</option>
          <option value="launch">Above launch</option>
        </select>
      </label>
      <div class="map-ctl" id="mapCtl">
        <button type="button" data-n="bearing:-15" aria-label="Rotate left">&#8634;</button>
        <button type="button" data-n="north" aria-label="Reset north">N</button>
        <button type="button" data-n="bearing:15" aria-label="Rotate right">&#8635;</button>
        <button type="button" data-n="pitch:8" aria-label="Tilt up">&#9650;</button>
        <button type="button" data-n="pitch:-8" aria-label="Tilt down">&#9660;</button>
        <button type="button" data-n="zoom:0.5" aria-label="Zoom in">+</button>
        <button type="button" data-n="zoom:-0.5" aria-label="Zoom out">&minus;</button>
      </div>
    </div>

    <button type="button" class="icon-btn fs" id="fsBtn" aria-label="Toggle fullscreen" title="Fullscreen">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>

    <div class="drop" id="drop">
      <div class="drop-card">
        <h1>Your flight, explained.</h1>
        <p>Drop EdgeTX telemetry CSV files here, choose them from disk, or pick a saved log from the top bar. Files are read in your browser and never uploaded.</p>
        <button type="button" class="primary" id="dropBtn">Open from computer</button>
        <p class="drop-error" id="dropError" role="alert"></p>
      </div>
    </div>

    <div class="hud" id="hud">
      <div class="hud-block batt">
        <label data-k="cells">BATT</label>
        <div class="batt-row">
          <div class="bar" data-k="bar"></div>
          <div><div class="big"><span data-k="vcell" data-level="ok">--</span><small> V/cell</small></div><div class="sub" data-k="pack"></div></div>
        </div>
      </div>
      <div class="hud-block">
        <label>ALT</label>
        <div class="big"><span data-k="alt">0.0</span><small> m</small></div>
        <canvas data-k="altSpark" class="spark"></canvas>
        <div class="sub" data-k="vs"></div>
      </div>
      <div class="hud-block">
        <label>SPD &middot; GPS</label>
        <div class="big"><span data-k="spd">0.0</span><small> km/h</small></div>
        <canvas data-k="spdSpark" class="spark"></canvas>
      </div>
      <div class="hud-block">
        <label>HDG &middot; GPS</label>
        <div class="big"><span data-k="hdg">0</span></div>
        <div class="sub" data-k="hdgLetter">N</div>
      </div>
      <div class="hud-block">
        <label>HOME</label>
        <div class="big"><span data-k="home">0</span><small> m</small><svg class="arrow" data-k="homeArrow" viewBox="0 0 24 24" width="16" height="16"><path d="M12 3l7 17-7-4-7 4z" fill="currentColor"/></svg></div>
        <div class="sub" data-k="sats"></div>
      </div>
      <div class="hud-block link">
        <label>LINK</label>
        <div class="big"><span data-k="lq">--</span><small> %</small></div>
        <div class="sub" data-k="rssi"></div>
      </div>
      <div class="hud-block sticks">
        <canvas data-k="gimL" class="gimbal" width="44" height="44"></canvas>
        <canvas data-k="gimR" class="gimbal" width="44" height="44"></canvas>
        <div class="stick-values">
          <span>T</span><b data-k="sT">0</b>
          <span>Y</span><b data-k="sY">0</b>
          <span>P</span><b data-k="sP">0</b>
          <span>R</span><b data-k="sR">0</b>
        </div>
      </div>
    </div>
  </div>

  <aside class="panel">
    <nav class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="summary" class="on">Summary</button>
      <button type="button" role="tab" data-tab="charts">Charts</button>
    </nav>
    <div class="pane on" id="paneSummary"></div>
    <div class="pane" id="paneCharts"></div>
  </aside>
</div>

<footer class="playbar">
  <div class="transport">
    <button type="button" class="icon-btn" id="btnStart" aria-label="Back to start" title="Back to start">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg>
    </button>
    <button type="button" class="icon-btn play" id="btnPlay" aria-label="Play" title="Play (space)">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="iconPlay"><path d="M7 4v16l13-8z"/></svg>
      <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" id="iconPause" hidden><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btnEnd" aria-label="Jump to end" title="Jump to end">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg>
    </button>
    <button type="button" class="icon-btn" id="btnNext" aria-label="Next event" title="Next event">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l2.6 5.6 6.1.7-4.5 4.2 1.2 6L12 16.5 6.6 19.5l1.2-6L3.3 9.3l6.1-.7z"/></svg>
    </button>
    <div class="speeds" id="speeds"></div>
  </div>
  <div class="timeline">
    <div class="track" id="track"></div>
    <input type="range" id="scrub" min="0" max="1" step="0.01" value="0" aria-label="Playback position">
  </div>
  <div class="readout" id="readout">T+0:00 / 0:00</div>
  <button type="button" class="icon-btn" id="legendBtn" aria-label="Explain timeline markers" aria-expanded="false" title="What do the timeline icons mean?">?</button>
  <div class="legend" id="legend" hidden></div>
  <div class="tl-tip" id="tlTip" hidden></div>
</footer>
</body>
</html>
